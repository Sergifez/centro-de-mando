<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14202f"/>
      <stop offset="1" stop-color="#070b10"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d6fa8"/>
      <stop offset="1" stop-color="#4fd2ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bg)" stroke="#3aa8e0" stroke-width="2"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1" transform="translate(0 1)"/>
  <g stroke-linecap="round" stroke-width="4">
    <line x1="14" y1="20" x2="50" y2="20" stroke="#223246"/>
    <line x1="14" y1="32" x2="50" y2="32" stroke="#223246"/>
    <line x1="14" y1="44" x2="50" y2="44" stroke="#223246"/>
    <line x1="14" y1="20" x2="38" y2="20" stroke="url(#ac)"/>
    <line x1="14" y1="32" x2="26" y2="32" stroke="url(#ac)"/>
    <line x1="14" y1="44" x2="43" y2="44" stroke="url(#ac)"/>
  </g>
  <g filter="url(#glow)" fill="#eaf8ff" stroke="#3aa8e0" stroke-width="2">
    <circle cx="38" cy="20" r="5.2"/>
    <circle cx="26" cy="32" r="5.2"/>
    <circle cx="43" cy="44" r="5.2"/>
  </g>
</svg>
